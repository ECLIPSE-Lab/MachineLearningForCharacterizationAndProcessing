project:
  type: manuscript

execute:
  freeze: auto

format:
  html:
    css: styles.css
    fontsize: 14pt
    email-obfuscation: javascript
    theme:
      - darkly
      - custom.scss
    toc: true
    comments:
      hypothesis: true
  docx: default
  jats: default
  # agu-pdf: default   # disabled 2026-05-24 — TeX Live 2026 on the CI runner breaks the LuaLaTeX build and blocks the gh-pages deploy; re-enable once the PDF toolchain is fixed



